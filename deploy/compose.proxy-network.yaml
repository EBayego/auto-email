# Optional: existing reverse proxy running inside Docker.
# The release/backup helpers include this file only with PROXY_NETWORK_NAME set.
services:
  web:
    networks:
      default: {}
      reverse-proxy:
        aliases: ['${COMPOSE_PROJECT_NAME}-web']

networks:
  reverse-proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:?Set the existing proxy network}
